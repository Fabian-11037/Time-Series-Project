name: Validar dataset y Jupyter Book
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install -r requirements-pytorch-cpu.txt
      - run: python scripts/verify_dataset.py
      - run: python -m unittest discover -s tests
      - run: python scripts/prepare_pipeline.py
      - run: python scripts/create_notebooks.py
      - run: python scripts/create_literature_notebooks.py
      - run: python scripts/create_model_notebook.py
      - run: python scripts/run_eda.py
      - run: python scripts/verify_book.py
      - uses: actions/upload-artifact@v4
        with:
          name: jupyter-book-colombia
          path: docs/
